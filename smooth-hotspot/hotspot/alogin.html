<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#04174F">
<title>Smooth Broadband Internet - Login Berhasil</title>
<meta http-equiv="refresh" content="3; url=$(link-status)">
<style>
:root{--deep:#04174F;--navy:#0A2A8A;--electric:#1F5BFF;--cyan:#22D3EE;--ice:#EAF4FF;--text:#0F2252;--muted:#5B6B8F;--line:#D8E3F5;--ok:#0E9F6E;--danger-bg:#FDECEC;--danger:#A12020}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0A2A8A}
body{margin:0;min-height:100vh;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:linear-gradient(145deg,var(--deep) 0%,var(--navy) 55%,var(--electric) 100%);line-height:1.5;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body::before{width:420px;height:420px;top:-150px;right:-120px;border:64px solid var(--cyan);opacity:.14}
body::after{width:380px;height:380px;bottom:-170px;left:-140px;border:56px solid #fff;opacity:.07}
.page{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding:clamp(20px,5vh,56px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.page.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:100%;max-width:300px;aspect-ratio:2.9/1;overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(2,12,60,.25)}
.logo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 52%}
.card{background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px rgba(2,12,60,.35)}
.card .logo{margin:0 auto 20px;box-shadow:none;border:1px solid var(--line)}
.card.narrow{width:100%;max-width:460px;text-align:center}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.4rem;font-weight:800;color:var(--navy)}
h3{font-size:1.1rem;font-weight:800;color:var(--navy)}
.sub{margin:6px 0 20px;color:var(--muted);font-size:.95rem}
.big{font-size:3.2rem;line-height:1;margin-bottom:10px}
.foot{margin-top:24px;text-align:center;color:rgba(255,255,255,.8);font-size:.85rem}
.btn{display:block;width:100%;margin-top:8px;padding:15px 16px;font:inherit;font-size:1.05rem;font-weight:800;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--electric),var(--navy));border:0;border-radius:12px;cursor:pointer;box-shadow:0 10px 22px rgba(31,91,255,.35);transition:filter .15s ease,transform .05s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.link-btn:focus-visible,.wa:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn[disabled]{opacity:.75;cursor:wait;filter:none}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
.alert{margin:0 0 16px;padding:12px 14px;font-size:.92rem;font-weight:600;text-align:left;color:var(--danger);background:var(--danger-bg);border:1px solid #F3C4C4;border-radius:12px}
[hidden]{display:none!important}

/* Login layout */
.layout{display:grid;gap:18px;grid-template-columns:1fr;grid-template-areas:"head" "panel" "features";animation:rise .5s ease both}
.head{grid-area:head;text-align:center;color:#fff}
.features{grid-area:features}
.panel{grid-area:panel;display:grid;gap:18px;align-content:start}
.head .logo{margin:0 auto 20px}
.head h1{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;letter-spacing:-.01em}
.head p{margin:10px auto 0;max-width:36ch;color:rgba(255,255,255,.85);font-size:1.02rem}
.chip{display:inline-block;margin-top:16px;padding:7px 14px;font-size:.88rem;font-weight:600;color:#C4F5FF;background:rgba(34,211,238,.16);border:1px solid rgba(34,211,238,.45);border-radius:99px}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr}
.feat{display:flex;gap:12px;align-items:flex-start;padding:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px}
.feat .ic{flex:none;width:42px;height:42px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,var(--cyan),var(--electric));border-radius:12px}
.feat b{display:block;font-size:1rem}
.feat span{display:block;font-size:.88rem;color:rgba(255,255,255,.8)}
@media(min-width:560px){.fgrid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
 .layout{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"head panel" "features panel";gap:28px 36px;align-items:start}
 .head{text-align:left}
 .head .logo{margin-left:0}
 .head p{margin-left:0}
 .card{padding:30px 28px}
}

/* Tabs */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;padding:4px;margin-bottom:20px;background:var(--ice);border-radius:14px}
.tabs .slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:linear-gradient(135deg,var(--electric),var(--navy));border-radius:11px;transition:transform .22s ease}
.tabs[data-mode="member"] .slider{transform:translateX(100%)}
.tabs[data-mode="qr"] .slider{transform:translateX(200%)}
.tab{position:relative;z-index:1;appearance:none;border:0;background:transparent;padding:12px 2px;font:inherit;font-weight:700;font-size:.88rem;white-space:nowrap;color:var(--navy);cursor:pointer;border-radius:11px;transition:color .22s ease}
.tab[aria-selected="true"]{color:#fff}

/* Fields */
.field{margin-bottom:14px;text-align:left}
label{display:block;margin-bottom:6px;font-weight:700;font-size:.9rem}
input[type="text"],input[type="password"]{width:100%;padding:14px;font:inherit;font-size:1rem;color:var(--text);background:#fff;border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s ease,box-shadow .15s ease}
input::placeholder{color:#93A1BC}
input:focus{outline:none;border-color:var(--electric);box-shadow:0 0 0 4px rgba(34,211,238,.3)}
input.invalid{border-color:#D14343}
.hint{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.link-btn{appearance:none;border:0;background:transparent;margin-top:8px;padding:6px 2px;font:inherit;font-size:.88rem;font-weight:700;color:var(--electric);cursor:pointer;border-radius:8px}

/* Scan QR */
.steps{margin:0 0 8px;padding-left:20px;font-size:.92rem;text-align:left}
.steps li{margin-bottom:6px}
.scan{position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:0 auto 12px;overflow:hidden;background:var(--deep);border-radius:16px}
.scan video{display:block;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;inset:16%;border:3px solid var(--cyan);border-radius:14px;box-shadow:0 0 0 999px rgba(4,23,79,.4)}
label.btn{cursor:pointer}
label.btn:focus-within{outline:3px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* Packages */
.table-wrap{overflow-x:auto;margin-top:12px}
table.price{width:100%;border-collapse:collapse;min-width:300px}
table.price th,table.price td{padding:12px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
table.price thead th{padding-top:0;font-size:.82rem;font-weight:700;color:var(--muted)}
table.price th:last-child,table.price td:last-child{text-align:right}
table.price tbody tr:last-child td{border-bottom:0}
.pkg{font-weight:700}
.badge{display:inline-block;padding:4px 10px;font-size:.8rem;font-weight:800;color:var(--electric);background:var(--ice);border:1px solid #C9DBFF;border-radius:99px;white-space:nowrap}
.rp{font-weight:800;color:var(--navy);white-space:nowrap}
.cs{text-align:center}
.cs p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.wa{display:block;padding:14px 12px;font-weight:800;font-size:.98rem;text-align:center;text-decoration:none;color:#fff;background:#0F8A47;border-radius:12px;word-break:break-word}
.wa:hover{filter:brightness(1.1)}

/* Status */
.pill{display:inline-block;margin:6px 0 16px;padding:5px 12px;font-size:.85rem;font-weight:700;color:#0A6B4B;background:#DDF7EC;border-radius:99px}
.rows{margin:0 0 14px;padding:0;text-align:left}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.row dt{color:var(--muted)}
.row dd{margin:0;font-weight:700;text-align:right;word-break:break-all}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{padding:14px 10px;background:var(--ice);border-radius:14px}
.stat small{display:block;color:var(--muted);font-size:.82rem}
.stat b{display:block;margin-top:2px;font-size:1.05rem;color:var(--navy);word-break:break-word}

/* Loading */
.spinner{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:6px solid var(--ice);border-top-color:var(--electric);border-right-color:var(--cyan);animation:spin .9s linear infinite}
.bar{height:6px;margin:18px 0 10px;overflow:hidden;background:var(--ice);border-radius:99px}
.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--electric),var(--cyan));animation:fill 2.4s ease forwards}
.small{font-size:.88rem;color:var(--muted)}
.small a{color:var(--electric);font-weight:700}
.err{margin:14px 0 4px;padding:12px 14px;font-weight:600;color:var(--danger);background:var(--danger-bg);border:1px solid #F3C4C4;border-radius:12px;word-break:break-word}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{to{width:100%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.layout,.spinner{animation:none}.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="page center">

<main class="card narrow">
  <div class="logo"><img src="img/logo.png" alt="Smooth Broadband Internet"></div>
  <div class="spinner" role="status" aria-label="Memuat"></div>
  <h2>Login berhasil</h2>
  <p class="sub" style="margin-bottom:0">Menghubungkan ke halaman status...</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p class="small">Tidak berpindah otomatis? <a href="$(link-status)">Klik di sini</a>.</p>
</main>
<script>
(function () {
  var statusUrl = '$(link-status)';
  setTimeout(function () { window.location.replace(statusUrl); }, 2000);
})();
</script>

<footer class="foot">&copy; <span class="year">2026</span> Smooth Broadband Internet.<br>All Rights Reserved.</footer>
<script>
(function () {
  var y = document.querySelectorAll('.year');
  for (var i = 0; i < y.length; i++) { y[i].textContent = new Date().getFullYear(); }
})();
</script>
</div>
</body>
</html>
